<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strokin'</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f8f9fa;
      --panel-2: #ffffff;
      --text: #1a1a1a;
      --muted: #6c757d;
      --accent: #28a745;
      --accent-2: #007bff;
      --danger: #dc3545;
      --card: #ffffff;
      --border: #dee2e6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 18px 22px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.95); backdrop-filter: blur(6px);
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 14px; justify-content: space-between;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; font-weight: 700; }
    header .actions { display: flex; gap: 10px; align-items: center; }
    .container {
      display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; max-width: 1300px; margin: 0 auto;
    }
    @media (min-width: 980px) {
      .container { grid-template-columns: 320px 1fr; }
    }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      overflow: hidden; }
    .panel h2 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
      background: rgba(0,0,0,.02); }
    .section { padding: 14px 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; padding: 10px 12px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; outline: none;
    }
    input[type="number"] { -moz-appearance: textfield; }
    .row { display: grid; grid-template-columns: 1fr 110px auto; gap: 10px; }
    .btn { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #ffffff; color: var(--text); cursor: pointer; font-weight: 600; }
    .btn:hover { background: #f8f9fa; }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn.primary:hover { background: #218838; }
    .btn.secondary { background: var(--accent-2); color: white; border-color: var(--accent-2); }
    .btn.secondary:hover { background: #0056b3; }
    .btn.ghost { background: transparent; border: none; }
    .tag { font-size: 12px; color: var(--muted); }
    .list { display: grid; gap: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .players-select { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 600px) {
      .players-select { grid-template-columns: 1fr 1fr; }
    }
    .mode { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .mode label { color: var(--text); font-size: 13px; display: inline-flex; gap: 8px; align-items: center; background: var(--card); padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
    .mode input { accent-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; text-align: center; border-bottom: 1px dashed var(--border); }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    tr:hover td { background: rgba(0,0,0,.02); }
    .dot { font-size: 18px; line-height: 1; }
    .legend { font-size: 12px; color: var(--muted); }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin: 6px 0 10px; }
    details[open] > summary { content: "▾ Players"; }
    details[open] > summary::before { content: "▾ "; }
    details:not([open]) > summary::before { content: "▸ "; }
    .json-editor { width: 100%; min-height: 120px; }
    .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      header h1 { font-size: 14px; }
      header .tag { display: none; }
      .btn { padding: 8px 10px; font-size: 13px; }
      .row { grid-template-columns: 1fr; }
      table { font-size: 14px; }
      th, td { padding: 8px 4px; }
      #fourballInputs { grid-template-columns: 1fr !important; }
    }
    @media (min-width: 601px) and (max-width: 900px) {
      #fourballInputs { grid-template-columns: 1fr 1fr !important; }
    }
    @media (min-width: 901px) {
      #fourballInputs { grid-template-columns: repeat(4, 1fr) !important; }
    }
    @media print {
      header, #setupPanel, .mode, .players-select, .flex, details { display: none !important; }
      .panel { border: none; box-shadow: none; background: white; }
      .panel h2 { display: none; }
      .section { padding: 0; }
      body { background: white; }
      .container { display: block; padding: 0; }
      table { page-break-inside: avoid; }
      .card { border: 1px solid #000; page-break-inside: avoid; margin-bottom: 20px; }
      .legend { color: #666; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏌️‍♂️ Strokin' Prototype</h1>
    <div class="actions">
      <button class="btn hidden" id="btnExport">Print PDF</button>
    </div>
  </header>

  <div class="container">
    <!-- Left: Setup -->
    <aside class="panel" id="setupPanel">
      <details>
        <summary style="padding:14px 16px; cursor:pointer; list-style:none; font-size:14px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); background:rgba(0,0,0,.02); border-bottom:1px solid var(--border); user-select:none;">
          Players
        </summary>
        <div class="section">
          <h3 style="margin:0 0 8px 0; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em;">Add player</h3>
          <div style="margin-bottom:10px">
            <input id="playerName" type="text" placeholder="Player name" style="margin-bottom:8px" />
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px">
              <input id="playerHcap" type="number" min="0" step="1" placeholder="Course HCP" />
              <select id="playerTeam">
                <option value="Red">Red Team</option>
                <option value="Blue">Blue Team</option>
              </select>
            </div>
            <button class="btn primary" id="addPlayer" style="width:100%">Add Player</button>
          </div>
          <div class="list" id="playersList"></div>
        </div>
      </details>
    </aside>

    <!-- Right: Matches & Output -->
    <main class="panel">
      <h2>Match Setup & Hole‑by‑Hole Strokes</h2>
      <div class="section">
        <div style="margin-bottom:10px">
          <label for="courseSelect">Course</label>
          <select id="courseSelect" style="margin-bottom:10px"></select>
          <!-- <details>
            <summary>Manage courses (add/edit via JSON)</summary>
            <textarea id="courseJson" class="json-editor" spellcheck="false" placeholder='{"name":"My Course","tees":"Blue","strokeIndex":[10,2,14,6,18,4,12,8,16,9,1,11,3,13,5,15,7,17]}'></textarea>
            <div class="flex">
              <button class="btn secondary" id="importCourse">Import / Update Course</button>
              <button class="btn" id="resetCourses">Reset Samples</button>
            </div>
            <div class="legend" style="margin-top:6px">Provide <span class="mono">strokeIndex</span> for holes 1–18. Optional fields: <span class="mono">name</span>, <span class="mono">tees</span>.</div>
          </details> -->
        </div>

        <div class="mode" style="margin-bottom:10px">
          <label><input type="radio" name="mode" value="singles" checked /> Singles (1v1)</label>
          <label><input type="radio" name="mode" value="fourball" /> Four‑Ball (2v2, each plays own ball)</label>
        </div>

        <div id="singlesInputs" class="players-select" style="margin-bottom:10px">
          <div>
            <label for="pA">Player A</label>
            <select id="pA"></select>
          </div>
          <div>
            <label for="pB">Player B</label>
            <select id="pB"></select>
          </div>
        </div>

        <div id="fourballInputs" class="players-select hidden" style="margin-bottom:10px;">
          <div>
            <label for="pA2">Team 1 — Player A</label>
            <select id="pA2"></select>
          </div>
          <div>
            <label for="pB2">Team 1 — Player B</label>
            <select id="pB2"></select>
          </div>
          <div>
            <label for="pC2">Team 2 — Player C</label>
            <select id="pC2"></select>
          </div>
          <div>
            <label for="pD2">Team 2 — Player D</label>
            <select id="pD2"></select>
          </div>
        </div>

        <div class="flex" style="margin-bottom:12px">
          <button class="btn primary" id="calc">Calculate Strokes</button>
          <span class="legend">Singles: higher handicap receives the difference. Four‑Ball: lowest plays off scratch; others receive full difference to low (USGA guideline).</span>
        </div>

        <div id="output"></div>
      </div>
    </main>
  </div>

  <script>
    // --- Sample courses (stroke index arrays are examples for prototyping) ---
    const SAMPLE_COURSES = [
      { id: crypto.randomUUID(), name: "Eisenhower — Men's", tees: "Men's", strokeIndex: [9,5,11,1,7,15,17,13,3,10,6,8,4,12,18,14,16,2] },
      { id: crypto.randomUUID(), name: "Presidential — Men's", tees: "Men's", strokeIndex: [7,13,11,17,3,9,1,5,15,10,6,18,2,8,4,16,14,12] },
      { id: crypto.randomUUID(), name: "Renditions — Men's", tees: "Men's", strokeIndex: [7,17,15,9,1,3,13,11,5,6,2,4,16,14,8,10,18,12] },
    ];

    // --- Prepopulated Players ---
    const DEFAULT_PLAYERS = [
      { id: crypto.randomUUID(), name: 'Goodman', hcap: 1, team: 'Red' },
      { id: crypto.randomUUID(), name: 'Zubey', hcap: 16, team: 'Blue' },
      { id: crypto.randomUUID(), name: 'Morrison', hcap: 10, team: 'Red' },
      { id: crypto.randomUUID(), name: 'Jahn', hcap: 18, team: 'Blue' },
      { id: crypto.randomUUID(), name: 'Papenfuse', hcap: 9, team: 'Red' },
      { id: crypto.randomUUID(), name: 'Sommers', hcap: 17, team: 'Blue' },
      { id: crypto.randomUUID(), name: 'Doyle', hcap: 15, team: 'Red' },
      { id: crypto.randomUUID(), name: 'LaRosee', hcap: 18, team: 'Blue' },
    ];

    // --- State ---
    const state = {
      players: [], // {id, name, hcap, team}
      courses: [], // {id, name, tees, strokeIndex[18]}
      selectedCourseId: null,
    };

    // --- Utilities ---
    const el = (sel) => document.querySelector(sel);
    const els = (sel) => Array.from(document.querySelectorAll(sel));

    const DATA_FILE = './strokin-data.json';
    const STORAGE_KEY = 'golfStrokeAllocatorState';

    // Check if we're running on a web server or locally
    const isLocalFile = window.location.protocol === 'file:';

    async function saveState() {
      if (isLocalFile) {
        // Use localStorage as fallback for local file access
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return;
      }

      try {
        const response = await fetch('./save-data.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state, null, 2)
        });
        if (!response.ok) {
          console.error('Failed to save state');
        }
      } catch (e) {
        console.error('Error saving state:', e);
      }
    }

    async function loadState() {
      if (isLocalFile) {
        // Use localStorage as fallback for local file access
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (parsed.players) state.players = parsed.players;
            if (parsed.courses) state.courses = parsed.courses;
            if (parsed.selectedCourseId) state.selectedCourseId = parsed.selectedCourseId;
          } catch (e) {
            console.warn('Failed to parse saved state', e);
          }
        }
        // Initialize with default players if none exist
        if (!state.players || state.players.length === 0) {
          state.players = DEFAULT_PLAYERS;
        }
        if (!state.courses || state.courses.length === 0) {
          state.courses = SAMPLE_COURSES;
          state.selectedCourseId = state.courses[0].id;
        }
        return;
      }

      try {
        const response = await fetch(DATA_FILE);
        if (response.ok) {
          const data = await response.json();
          if (data.players) state.players = data.players;
          if (data.courses) state.courses = data.courses;
          if (data.selectedCourseId) state.selectedCourseId = data.selectedCourseId;
        } else {
          // File not found or error - use defaults
          state.players = DEFAULT_PLAYERS;
          state.courses = SAMPLE_COURSES;
          state.selectedCourseId = state.courses[0].id;
          await saveState();
        }
      } catch (e) {
        console.warn('Failed to load saved state, using defaults', e);
        state.players = DEFAULT_PLAYERS;
        state.courses = SAMPLE_COURSES;
        state.selectedCourseId = state.courses[0].id;
      }
    }

    function renderPlayersList() {
      const list = el('#playersList');
      list.innerHTML = '';
      // Sort: Blue team first (alphabetically), then Red team (alphabetically)
      const sorted = [...state.players].sort((a, b) => {
        if (a.team !== b.team) {
          return a.team === 'Blue' ? -1 : 1;
        }
        return a.name.localeCompare(b.name);
      });
      sorted.forEach(p => {
        const d = document.createElement('div');
        d.className = 'card';
        const teamColor = p.team === 'Red' ? '#dc3545' : '#007bff';
        d.innerHTML = `
          <div>
            <div style="font-weight:700">${escapeHtml(p.name)} ${p.team ? `<span class="tag" style="color:${teamColor}; font-weight:600">${escapeHtml(p.team)}</span>` : ''}</div>
            <div class="tag">Course HCP: <span class="mono">${p.hcap}</span></div>
          </div>
          <div class="flex">
            <button class="btn ghost" data-edit="${p.id}">Edit</button>
            <button class="btn" style="color:var(--danger)" data-del="${p.id}">Delete</button>
          </div>
        `;
        list.appendChild(d);
      });
      // Fill selects with filtering
      updatePlayerSelects();
    }

    function updatePlayerSelects() {
      // Get currently selected players
      const mode = document.querySelector('input[name="mode"]:checked')?.value || 'singles';

      if (mode === 'singles') {
        const selectedA = el('#pA')?.value;
        const selectedB = el('#pB')?.value;

        updateSelect('#pA', [selectedB]);
        updateSelect('#pB', [selectedA]);
      } else {
        const selectedA2 = el('#pA2')?.value;
        const selectedB2 = el('#pB2')?.value;
        const selectedC2 = el('#pC2')?.value;
        const selectedD2 = el('#pD2')?.value;

        updateSelect('#pA2', [selectedB2, selectedC2, selectedD2]);
        updateSelect('#pB2', [selectedA2, selectedC2, selectedD2]);
        updateSelect('#pC2', [selectedA2, selectedB2, selectedD2]);
        updateSelect('#pD2', [selectedA2, selectedB2, selectedC2]);
      }
    }

    function updateSelect(selector, excludeIds) {
      const select = el(selector);
      if (!select) return;

      const currentValue = select.value;
      const filtered = state.players.filter(p => !excludeIds.includes(p.id));

      select.innerHTML = '<option value="">– Select –</option>' +
        filtered.map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${p.hcap})${p.team ? ' - ' + escapeHtml(p.team) : ''}</option>`).join('');

      // Restore selection if still valid
      if (currentValue && !excludeIds.includes(currentValue)) {
        select.value = currentValue;
      }
    }

    function renderCourses() {
      const sel = el('#courseSelect');
      if (sel) {
        sel.innerHTML = state.courses.map(c => `<option value="${c.id}" ${c.id===state.selectedCourseId?'selected':''}>${escapeHtml(c.name)}${c.tees?` — ${escapeHtml(c.tees)}`:''}</option>`).join('');
      }
    }

    function getCourse() { return state.courses.find(c => c.id === state.selectedCourseId); }
    function getPlayer(id) { return state.players.find(p => p.id === id); }

    function escapeHtml(s='') { return s.replace(/[&<>"]+/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

    // Stroke allocation helpers
    function perHoleDotsFromDiff(strokeIndexArray, diff) {
      // Returns array[18] with 0/1/2 (dots per hole) given stroke index ranking and handicap diff
      const dots = Array(18).fill(0);
      if (diff <= 0) return dots;
      // First pass: give 1 stroke on holes with SI <= min(diff,18)
      const firstPass = Math.min(diff, 18);
      for (let i = 0; i < 18; i++) {
        const si = strokeIndexArray[i];
        if (si <= firstPass) dots[i] = 1;
      }
      // Second pass for diffs > 18: give an extra stroke on holes with SI <= (diff - 18)
      if (diff > 18) {
        const extras = Math.min(diff - 18, 18);
        for (let i = 0; i < 18; i++) {
          const si = strokeIndexArray[i];
          if (si <= extras) dots[i] = 2;
        }
      }
      return dots;
    }

    function renderSinglesTable(pHi, pLo, course) {
      const diff = Math.max(pHi.hcap - pLo.hcap, 0);
      const dotsForHi = perHoleDotsFromDiff(course.strokeIndex, diff);
      const rows = [];
      for (let i = 0; i < 18; i++) {
        const hole = i+1;
        const si = course.strokeIndex[i];
        const aCell = (pHi.id === pAId()) ? dotStr(dotsForHi[i]) : '';
        const bCell = (pHi.id === pBId()) ? dotStr(dotsForHi[i]) : '';
        rows.push(`<tr><td>${hole}</td><td>${si}</td><td>${aCell}</td><td>${bCell}</td></tr>`);
      }
      return `
        <div class="card" style="justify-content:space-between; margin-bottom:10px">
          <div>
            <div style="font-weight:700;">Singles — ${escapeHtml(pA().name)} vs ${escapeHtml(pB().name)}</div>
            <div class="tag">Course: ${escapeHtml(course.name)}${course.tees?` — ${escapeHtml(course.tees)}`:''} • HCP Diff: <span class="mono">${diff}</span></div>
          </div>
        </div>
        <table>
          <thead>
            <tr><th>Hole</th><th>SI</th><th>${escapeHtml(pA().name)}</th><th>${escapeHtml(pB().name)}</th></tr>
          </thead>
          <tbody>
            ${rows.join('')}
          </tbody>
        </table>
        <div class="legend" style="margin-top:8px">• = 1 stroke received on that hole (for higher‑handicap player). If diff &gt; 18, top SI holes may show •• (2 strokes).</div>
      `;
    }

    function renderFourballTable(players, course) {
      // players: [A,B,C,D]; each gets (hcap - minHcap) strokes
      const minH = Math.min(...players.map(p => p.hcap));
      const diffs = players.map(p => p.hcap - minH);
      const dots = diffs.map(d => perHoleDotsFromDiff(course.strokeIndex, d));
      const rows = [];
      for (let i = 0; i < 18; i++) {
        const hole = i+1;
        const si = course.strokeIndex[i];
        rows.push(`<tr>
          <td>${hole}</td><td>${si}</td>
          <td>${dotStr(dots[0][i])}</td>
          <td>${dotStr(dots[1][i])}</td>
          <td>${dotStr(dots[2][i])}</td>
          <td>${dotStr(dots[3][i])}</td>
        </tr>`);
      }
      return `
        <div class="card" style="justify-content:space-between; margin-bottom:10px">
          <div>
            <div style="font-weight:700;">Four‑Ball — Team 1 (${escapeHtml(players[0].name)} & ${escapeHtml(players[1].name)}) vs Team 2 (${escapeHtml(players[2].name)} & ${escapeHtml(players[3].name)})</div>
            <div class="tag">Course: ${escapeHtml(course.name)}${course.tees?` — ${escapeHtml(course.tees)}`:''} • Low plays scratch; others receive full difference to low.</div>
          </div>
        </div>
        <table>
          <thead>
            <tr><th>Hole</th><th>SI</th><th>${escapeHtml(players[0].name)}</th><th>${escapeHtml(players[1].name)}</th><th>${escapeHtml(players[2].name)}</th><th>${escapeHtml(players[3].name)}</th></tr>
          </thead>
          <tbody>
            ${rows.join('')}
          </tbody>
        </table>
        <div class="legend" style="margin-top:8px">Each player receives strokes on holes where SI ≤ their difference to the low player. If difference &gt; 18, top SI holes show ••.</div>
      `;
    }

    function dotStr(n) { return n === 0 ? '' : `<span class="dot">${'•'.repeat(n)}</span>`; }

    // Selected IDs helpers
    const pAId = () => el('#pA').value;
    const pBId = () => el('#pB').value;

    const pA = () => getPlayer(pAId());
    const pB = () => getPlayer(pBId());

    // --- Event wiring ---
    async function init() {
      await loadState();
      renderPlayersList();
      renderCourses();
      // Add player
      el('#addPlayer').addEventListener('click', () => {
        const name = el('#playerName').value.trim();
        const hcap = Number(el('#playerHcap').value);
        const team = el('#playerTeam').value;
        if (!name || !Number.isFinite(hcap)) { alert('Enter player name and numeric course handicap.'); return; }
        const existing = state.players.find(p => p.name.toLowerCase() === name.toLowerCase());
        if (existing) {
          existing.hcap = hcap;
          existing.team = team;
        } else {
          state.players.push({ id: crypto.randomUUID(), name, hcap, team });
        }
        el('#playerName').value = '';
        el('#playerHcap').value = '';
        el('#playerTeam').value = 'Red';
        saveState(); renderPlayersList();
      });
      // Edit / Delete player actions
      el('#playersList').addEventListener('click', (e) => {
        const del = e.target.getAttribute('data-del');
        const edit = e.target.getAttribute('data-edit');
        if (del) {
          state.players = state.players.filter(p => p.id !== del);
          saveState(); renderPlayersList();
        } else if (edit) {
          const p = getPlayer(edit);
          const newName = prompt('Edit name', p.name) ?? p.name;
          const newH = prompt('Edit course handicap (number)', p.hcap);
          const h = Number(newH);
          if (!Number.isFinite(h)) { alert('Handicap must be a number'); return; }
          const newTeam = prompt('Edit team (Red or Blue)', p.team || 'Red');
          if (newTeam !== 'Red' && newTeam !== 'Blue') { alert('Team must be Red or Blue'); return; }
          p.name = newName.trim();
          p.hcap = h;
          p.team = newTeam;
          saveState(); renderPlayersList();
        }
      });

      // Course selection (only if element exists)
      const courseSelect = el('#courseSelect');
      if (courseSelect) {
        courseSelect.addEventListener('change', (e) => { state.selectedCourseId = e.target.value; saveState(); });
      }

      // Import course JSON (only if element exists)
      const importCourse = el('#importCourse');
      if (importCourse) {
        importCourse.addEventListener('click', () => {
          let raw = el('#courseJson').value.trim();
          if (!raw) { alert('Paste a JSON object for a course.'); return; }
          try {
            const obj = JSON.parse(raw);
            if (!Array.isArray(obj.strokeIndex) || obj.strokeIndex.length !== 18) throw new Error('strokeIndex must be array of 18 numbers');
            const cleaned = obj.strokeIndex.map(Number);
            if (cleaned.some(n => !Number.isFinite(n) || n < 1 || n > 18)) throw new Error('strokeIndex values must be integers 1–18');
            let course;
            if (obj.id && state.courses.some(c => c.id === obj.id)) {
              course = state.courses.find(c => c.id === obj.id);
              Object.assign(course, { name: obj.name ?? course.name, tees: obj.tees ?? course.tees, strokeIndex: cleaned });
            } else {
              course = { id: crypto.randomUUID(), name: obj.name || 'Custom Course', tees: obj.tees || '', strokeIndex: cleaned };
              state.courses.push(course);
            }
            state.selectedCourseId = course.id;
            saveState(); renderCourses(); alert('Course imported.');
          } catch (err) { alert('Invalid JSON: ' + err.message); }
        });
      }

      // Reset courses (only if element exists)
      const resetCourses = el('#resetCourses');
      if (resetCourses) {
        resetCourses.addEventListener('click', () => {
          if (!confirm('Reset to sample courses? This keeps your players.')) return;
          state.courses = SAMPLE_COURSES.map(c => ({...c, id: crypto.randomUUID()}));
          state.selectedCourseId = state.courses[0].id;
          saveState(); renderCourses();
        });
      }

      // Mode switching
      els('input[name="mode"]').forEach(r => r.addEventListener('change', () => {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        el('#singlesInputs').classList.toggle('hidden', mode !== 'singles');
        el('#fourballInputs').classList.toggle('hidden', mode !== 'fourball');
        updatePlayerSelects();
      }));

      // Update selects when player selections change
      ['#pA','#pB','#pA2','#pB2','#pC2','#pD2'].forEach(sel => {
        const elem = el(sel);
        if (elem) {
          elem.addEventListener('change', () => updatePlayerSelects());
        }
      });

      // Calculate
      el('#calc').addEventListener('click', () => {
        const course = getCourse();
        if (!course) { alert('Select a course'); return; }
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === 'singles') {
          const A = getPlayer(el('#pA').value);
          const B = getPlayer(el('#pB').value);
          if (!A || !B || A.id === B.id) { alert('Choose two different players.'); return; }
          const hi = (A.hcap >= B.hcap) ? A : B;
          const lo = (A.hcap >= B.hcap) ? B : A;
          el('#output').innerHTML = renderSinglesTable(hi, lo, course);
        } else {
          const ids = ['#pA2','#pB2','#pC2','#pD2'].map(sel=>el(sel).value);
          const uniq = new Set(ids.filter(Boolean));
          if (uniq.size !== 4) { alert('Pick four distinct players.'); return; }
          const players = ids.map(id => getPlayer(id));
          el('#output').innerHTML = renderFourballTable(players, course);
        }
        // Show the Print PDF button after calculating scores
        el('#btnExport').classList.remove('hidden');
      });

      // Print/export
      el('#btnExport').addEventListener('click', () => window.print());
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
